<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel – ZBYTE</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #050510; color: #fff; padding: 20px; max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 16px; }
    button { background: #7c3aed; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; margin-right: 8px; }
    button.danger { background: #ef4444; }
    button.secondary { background: #334155; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.85rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #333; }
    th { color: #a78bfa; }
    .logout { background: #ef4444; margin-bottom: 20px; }
    .section { margin-bottom: 30px; }
    .withdrawal-card { background: rgba(30,30,60,0.6); border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .withdrawal-card p { margin: 4px 0; font-size: 0.85rem; }
    .status-pending { color: #f59e0b; }
    .status-approved { color: #22c55e; }
  </style>
</head>
<body>
  <button class="logout" onclick="logout()">Logout</button>
  <h1>Admin Panel</h1>

  <div style="margin-bottom: 20px;">
    <button class="secondary" id="autoApproveBtn" onclick="toggleAutoApprove()">Auto-Approve: OFF</button>
    <button class="danger" onclick="deductFee()">Deduct ₦5,000 Fee</button>
  </div>

  <div class="section">
    <h2>Users</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Membership</th>
          <th>Paid</th>
        </tr>
      </thead>
      <tbody id="usersTable"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Withdrawal Requests</h2>
    <div id="withdrawalsList">Loading...</div>
  </div>

  <script>
    const token = localStorage.getItem('zbyte_token') || localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    let autoApproveOn = false;

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users', { headers: { 'Authorization': 'Bearer ' + token } });
        const users = await res.json();
        const tbody = document.getElementById('usersTable');
        if (!users || users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">No users found.</td></tr>';
          return;
        }
        tbody.innerHTML = users.map(u => `
          <tr>
            <td>${u.name || '-'}</td>
            <td>${u.email || '-'}</td>
            <td>${u.phone || '-'}</td>
            <td>${u.membership || 'free'}</td>
            <td>${u.paid ? 'Yes' : 'No'}</td>
          </tr>
        `).join('');
      } catch (e) {
        document.getElementById('usersTable').innerHTML = '<tr><td colspan="5">Error loading users.</td></tr>';
      }
    }

    async function loadWithdrawals() {
      try {
        const res = await fetch('/api/admin/withdrawals', { headers: { 'Authorization': 'Bearer ' + token } });
        const withdrawals = await res.json();
        const container = document.getElementById('withdrawalsList');
        if (!withdrawals || withdrawals.length === 0) {
          container.innerHTML = '<p>No withdrawal requests.</p>';
          return;
        }
        container.innerHTML = withdrawals.map(w => `
          <div class="withdrawal-card">
            <p><strong>User:</strong> ${w.userId || '-'}</p>
            <p><strong>Amount:</strong> ₦${(w.amount || 0).toLocaleString()}</p>
            <p><strong>Bank:</strong> ${w.bankName || '-'}</p>
            <p><strong>Account Number:</strong> ${w.accountNumber || '-'}</p>
            <p><strong>Account Name:</strong> ${w.accountName || '-'}</p>
            <p><strong>Status:</strong> <span class="status-\( {w.status || 'pending'}"> \){w.status || 'pending'}</span></p>
            <p><strong>Date:</strong> ${w.date ? new Date(w.date).toLocaleString() : '-'}</p>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('withdrawalsList').innerHTML = '<p>Error loading withdrawals.</p>';
      }
    }

    async function toggleAutoApprove() {
      autoApproveOn = !autoApproveOn;
      document.getElementById('autoApproveBtn').textContent = 'Auto-Approve: ' + (autoApproveOn ? 'ON' : 'OFF');
      if (autoApproveOn) {
        try {
          await fetch('/api/admin/auto-approve', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          alert('All pending withdrawals approved.');
          loadWithdrawals();
        } catch (e) {
          alert('Error approving withdrawals.');
        }
      }
    }

    async function deductFee() {
      if (!confirm('Deduct ₦5,000 from all active users?')) return;
      try {
        const res = await fetch('/api/admin/deduct-fee', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        alert('Fee deducted from ' + (result.count || 0) + ' users. Total: ₦' + (result.totalDeducted || 0).toLocaleString());
        loadUsers();
      } catch (e) {
        alert('Error deducting fee.');
      }
    }

    loadUsers();
    loadWithdrawals();
  </script>
</body>
</html>
