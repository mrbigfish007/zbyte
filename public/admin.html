<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – ZBYTE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #050510; color: #fff; padding: 20px; }
    h1 { margin-bottom: 16px; }
    h2 { margin: 20px 0 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid rgba(124,58,237,0.3); }
    th { color: #a78bfa; }
    .logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 16px; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .btn { background: #7c3aed; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .btn.on { background: #22c55e; }
    .btn.off { background: #64748b; }
    .btn.danger { background: #ef4444; }
  </style>
</head>
<body>
  <button class="logout" onclick="logout()">Logout</button>
  <h1>Admin Panel</h1>

  <div class="controls">
    <button class="btn off" id="autoApproveBtn" onclick="toggleAutoApprove()">Auto-Approve: OFF</button>
    <button class="btn danger" onclick="deductMonthlyFee()">Deduct ₦5,000 Fee</button>
  </div>

  <h2>Users</h2>
  <div id="users">Loading...</div>

  <h2>Withdrawal Requests</h2>
  <div id="withdrawals">Loading...</div>

  <script>
    const token = localStorage.getItem('zbyte_token') || localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    let autoApprove = false;

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users', { headers: { 'Authorization': 'Bearer ' + token } });
        if (!res.ok) throw new Error('Access denied');
        const users = await res.json();
        if (!users.length) {
          document.getElementById('users').innerHTML = '<p>No users yet.</p>';
          return;
        }
        let html = '<table><tr><th>Name</th><th>Email</th><th>Membership</th><th>Task Wallet</th><th>Referral</th></tr>';
        users.forEach(function(u) {
          html += '<tr><td>' + (u.name || '-') + '</td><td>' + u.email + '</td><td>' + (u.membership || 'free') + '</td><td>₦' + (u.taskWallet || 0) + '</td><td>₦' + (u.referralWallet || 0) + '</td></tr>';
        });
        html += '</table>';
        document.getElementById('users').innerHTML = html;
      } catch (e) {
        document.getElementById('users').innerHTML = '<p style="color:#f87171;">' + e.message + '</p>';
      }
    }

    async function loadWithdrawals() {
      try {
        const res = await fetch('/api/admin/withdrawals', { headers: { 'Authorization': 'Bearer ' + token } });
        if (!res.ok) throw new Error('Could not load');
        const withdrawals = await res.json();
        if (!withdrawals.length) {
          document.getElementById('withdrawals').innerHTML = '<p>No withdrawal requests.</p>';
          return;
        }
        let html = '<table><tr><th>User</th><th>Amount</th><th>Bank</th><th>Account</th><th>Status</th></tr>';
        withdrawals.forEach(function(w) {
          html += '<tr><td>' + w.userId + '</td><td>₦' + w.amount + '</td><td>' + (w.bankName || '-') + '</td><td>' + (w.accountNumber || '-') + '</td><td>' + (w.status || 'pending') + '</td></tr>';
        });
        html += '</table>';
        document.getElementById('withdrawals').innerHTML = html;
      } catch (e) {
        document.getElementById('withdrawals').innerHTML = '<p>No withdrawals yet.</p>';
      }
    }

    async function toggleAutoApprove() {
      autoApprove = !autoApprove;
      const btn = document.getElementById('autoApproveBtn');
      btn.textContent = autoApprove ? 'Auto-Approve: ON' : 'Auto-Approve: OFF';
      btn.className = autoApprove ? 'btn on' : 'btn off';
      
      if (autoApprove) {
        try {
          const res = await fetch('/api/admin/auto-approve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
          });
          if (res.ok) {
            alert('All pending withdrawals approved');
            loadWithdrawals();
          }
        } catch (e) {
          alert('Error');
        }
      }
    }

    async function deductMonthlyFee() {
      if (!confirm('Deduct ₦5,000 from all active users?')) return;
      try {
        const res = await fetch('/api/admin/deduct-fee', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        if (res.ok) {
          alert('Fee deducted from ' + (result.count || 0) + ' users');
          loadUsers();
        } else {
          alert(result.error || 'Failed');
        }
      } catch (e) {
        alert('Error');
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    loadUsers();
    loadWithdrawals();
  </script>
</body>
</html>
