<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Zbyte</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
    .container { max-width: 420px; margin: 40px auto; padding: 20px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; margin-bottom: 24px; font-size: 1.6rem; }
    label { display: block; margin: 12px 0 6px; font-weight: 500; font-size: 0.95rem; }
    input, select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 1rem; }
    .tier { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin: 8px 0; cursor: pointer; }
    .tier.selected { border-color: #16a34a; background: #f0fdf4; }
    .tier input { margin-right: 8px; }
    button { width: 100%; background: #16a34a; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1.05rem; font-weight: 600; margin-top: 16px; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    .error { color: #dc2626; margin-top: 12px; font-size: 0.9rem; }
    .footer { text-align: center; margin-top: 30px; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Create Account</h1>

    <label>Full Name</label>
    <input type="text" id="name" placeholder="Your full name" required />

    <label>Phone (Nigeria)</label>
    <input type="tel" id="phone" placeholder="080xxxxxxxx" required />

    <label>Email</label>
    <input type="email" id="email" placeholder="you@email.com" required />

    <label>Password</label>
    <input type="password" id="password" placeholder="Create a password" required />

    <label>Referral Code (optional)</label>
    <input type="text" id="referral" placeholder="Enter code if you have one" />

    <label>Membership (one-time)</label>
    <div class="tier" onclick="selectTier('premium')">
      <input type="radio" name="tier" value="premium" /> Premium – ₦10,000 <small>(2 tasks)</small>
    </div>
    <div class="tier" onclick="selectTier('silver')">
      <input type="radio" name="tier" value="silver" /> Silver – ₦20,000 <small>(4 tasks)</small>
    </div>
    <div class="tier" onclick="selectTier('gold')">
      <input type="radio" name="tier" value="gold" /> Gold – ₦30,000 <small>(7 tasks)</small>
    </div>

    <label style="font-size:0.85rem; display:flex; align-items:center; gap:8px; margin-top:16px;">
      <input type="checkbox" id="agree" />
      I am a Nigerian resident (18+), I understand the monthly ₦5,000 fee and withdrawal minima, and I agree to the Terms.
    </label>

    <button id="btn" onclick="register()">Create Account & Pay</button>
    <div class="error" id="error"></div>

    <div class="footer">
      Zbyte – Complete tasks. Earn in Naira.
    </div>
  </div>

  <script>
    let selectedTier = '';

    function selectTier(tier) {
      selectedTier = tier;
      document.querySelectorAll('.tier').forEach(el => el.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
      document.querySelector(`input[value="${tier}"]`).checked = true;
    }

    async function register() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const referral = document.getElementById('referral').value.trim();
      const agree = document.getElementById('agree').checked;

      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      if (!name || !email || !password || !selectedTier) {
        errorEl.textContent = 'Please fill name, email, password and choose a membership.';
        return;
      }
      if (!agree) {
        errorEl.textContent = 'You must agree to the terms.';
        return;
      }

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            email,
            phone,
            password,
            tier: selectedTier,
            referralCode: referral
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        if (data.paymentUrl) {
          window.location.href = data.paymentUrl;
        } else {
          throw new Error('No payment link received');
        }
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Create Account & Pay';
      }
    }
  </script>
</body>
  </html>
