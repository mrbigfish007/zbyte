<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Registration - Paystack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 520px;
            width: 100%;
        }
        h1, h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .membership-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .membership-option {
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .membership-option:hover, .membership-option.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .membership-option input {
            width: auto;
            margin-right: 10px;
        }
        .fee {
            float: right;
            font-weight: bold;
            color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5a6fd8;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .profile-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .hidden { display: none; }
        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
        }
        .logout-btn {
            background: #dc3545;
            margin-top: 15px;
        }
        .upgrade-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e1e1e1;
        }
        .upgrade-section h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 18px;
        }
        .upgrade-btn {
            margin-bottom: 10px;
            background: #28a745;
        }
        .upgrade-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <!-- Registration Section -->
    <div id="registrationSection" class="container">
        <h1>Membership Registration</h1>
        <form id="registrationForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="Enter your phone number">
            </div>
            <div class="form-group">
                <label>Select Membership Plan</label>
                <div class="membership-options" id="membershipOptions">
                    <!-- Options will be populated by JS -->
                </div>
                <div id="membershipError" class="error"></div>
            </div>
            <button type="submit" id="payButton">Proceed to Payment</button>
        </form>
    </div>

    <!-- Profile / Dashboard Section -->
    <div id="profileSection" class="container hidden">
        <h2>Your Dashboard</h2>
        <div id="profileContent" class="profile-card"></div>
        <div id="upgradeSection" class="upgrade-section hidden">
            <h3>Upgrade Your Membership</h3>
            <div id="upgradeOptions"></div>
        </div>
        <button id="logoutBtn" class="logout-btn">Logout / Clear Profile</button>
    </div>

    <!-- Paystack Script -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script>
        // ============ CONFIGURATION ============
        const PAYSTACK_PUBLIC_KEY = 'pk_live_a20e3e61611e1a6e7c1ce7e538ae76e497d6ccda';

        // Membership plans (amount in Naira)
        const membershipPlans = [
            { id: 'premium', name: 'Premium', fee: 10000, description: 'Access to premium features' },
            { id: 'silver', name: 'Silver', fee: 20000, description: 'Enhanced benefits + priority support' },
            { id: 'gold', name: 'Gold', fee: 30000, description: 'All features + exclusive Gold benefits' }
        ];

        // ============ DOM ELEMENTS ============
        const registrationSection = document.getElementById('registrationSection');
        const profileSection = document.getElementById('profileSection');
        const registrationForm = document.getElementById('registrationForm');
        const membershipOptions = document.getElementById('membershipOptions');
        const membershipError = document.getElementById('membershipError');
        const profileContent = document.getElementById('profileContent');
        const upgradeSection = document.getElementById('upgradeSection');
        const upgradeOptions = document.getElementById('upgradeOptions');
        const logoutBtn = document.getElementById('logoutBtn');

        let selectedPlan = null;

        // ============ INITIALIZE ============
        function init() {
            const savedProfile = localStorage.getItem('userProfile');
            if (savedProfile) {
                showProfile(JSON.parse(savedProfile));
            } else {
                renderMembershipOptions();
            }
        }

        // ============ RENDER MEMBERSHIP OPTIONS ============
        function renderMembershipOptions() {
            membershipOptions.innerHTML = '';
            membershipPlans.forEach(plan => {
                const option = document.createElement('div');
                option.className = 'membership-option';
                option.innerHTML = `
                    <input type="radio" name="membership" value="${plan.id}" id="plan-${plan.id}">
                    <label for="plan-${plan.id}">
                        <strong>${plan.name}</strong>
                        <span class="fee">₦${plan.fee.toLocaleString()}</span>
                        <div style="font-size:13px;color:#666;margin-top:4px;">${plan.description}</div>
                    </label>
                `;
                option.addEventListener('click', () => selectPlan(plan, option));
                membershipOptions.appendChild(option);
            });
        }

        function selectPlan(plan, element) {
            document.querySelectorAll('.membership-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            element.querySelector('input').checked = true;
            selectedPlan = plan;
            membershipError.textContent = '';
        }

        // ============ FORM SUBMISSION ============
        registrationForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!selectedPlan) {
                membershipError.textContent = 'Please select a membership plan';
                return;
            }

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!fullName || !email || !phone) {
                alert('Please fill in all fields');
                return;
            }

            // Start Paystack payment for new registration
            payWithPaystack(fullName, email, phone, selectedPlan, false);
        });

        // ============ PAYSTACK PAYMENT ============
        function payWithPaystack(fullName, email, phone, plan, isUpgrade = false, currentProfile = null) {
            let amountToCharge = plan.fee;
            let amountInKobo = amountToCharge * 100;

            // For upgrades, charge only the difference
            if (isUpgrade && currentProfile) {
                const currentPlan = membershipPlans.find(p => p.id === currentProfile.membershipId);
                if (currentPlan && plan.fee > currentPlan.fee) {
                    amountToCharge = plan.fee - currentPlan.fee;
                    amountInKobo = amountToCharge * 100;
                }
            }

            const handler = PaystackPop.setup({
                key: PAYSTACK_PUBLIC_KEY,
                email: email,
                amount: amountInKobo,
                currency: 'NGN',
                ref: (isUpgrade ? 'UPG_' : 'MEM_') + Date.now() + '_' + Math.floor(Math.random() * 10000),
                metadata: {
                    custom_fields: [
                        { display_name: "Full Name", variable_name: "full_name", value: fullName },
                        { display_name: "Phone Number", variable_name: "phone", value: phone },
                        { display_name: "Membership Plan", variable_name: "membership_plan", value: plan.name },
                        { display_name: "Type", variable_name: "type", value: isUpgrade ? "Upgrade" : "New Registration" }
                    ]
                },
                callback: function(response) {
                    // Payment successful
                    let profileData;

                    if (isUpgrade && currentProfile) {
                        profileData = {
                            ...currentProfile,
                            membership: plan.name,
                            membershipId: plan.id,
                            feePaid: (currentProfile.feePaid || 0) + amountToCharge,
                            lastPaymentReference: response.reference,
                            lastUpgradeDate: new Date().toISOString(),
                            status: 'Active'
                        };
                        alert('Upgrade successful! You are now on the ' + plan.name + ' plan.\nReference: ' + response.reference);
                    } else {
                        profileData = {
                            fullName: fullName,
                            email: email,
                            phone: phone,
                            membership: plan.name,
                            membershipId: plan.id,
                            feePaid: plan.fee,
                            paymentReference: response.reference,
                            registrationDate: new Date().toISOString(),
                            status: 'Active'
                        };
                        alert('Payment successful! Your membership is now active.\nReference: ' + response.reference);
                    }

                    // Save permanently to localStorage
                    localStorage.setItem('userProfile', JSON.stringify(profileData));
                    
                    // Show updated profile/dashboard
                    showProfile(profileData);
                },
                onClose: function() {
                    alert('Payment window closed. You can try again.');
                }
            });

            handler.openIframe();
        }

        // ============ SHOW PROFILE / DASHBOARD ============
        function showProfile(profile) {
            registrationSection.classList.add('hidden');
            profileSection.classList.remove('hidden');

            profileContent.innerHTML = `
                <p><strong>Name:</strong> ${profile.fullName}</p>
                <p><strong>Email:</strong> ${profile.email}</p>
                <p><strong>Phone:</strong> ${profile.phone}</p>
                <p><strong>Current Membership:</strong> <span style="color:#667eea;font-weight:bold;">${profile.membership}</span></p>
                <p><strong>Total Amount Paid:</strong> ₦${(profile.feePaid || 0).toLocaleString()}</p>
                <p><strong>Payment Ref:</strong> ${profile.paymentReference || profile.lastPaymentReference || 'N/A'}</p>
                <p><strong>Registered:</strong> ${new Date(profile.registrationDate).toLocaleString()}</p>
                ${profile.lastUpgradeDate ? `<p><strong>Last Upgrade:</strong> ${new Date(profile.lastUpgradeDate).toLocaleString()}</p>` : ''}
                <p><strong>Status:</strong> <span style="color:green;font-weight:bold;">${profile.status}</span></p>
            `;

            // Show upgrade options if not on the highest plan
            showUpgradeOptions(profile);
        }

        // ============ UPGRADE OPTIONS ============
        function showUpgradeOptions(profile) {
            upgradeOptions.innerHTML = '';
            const currentPlanIndex = membershipPlans.findIndex(p => p.id === profile.membershipId);

            // Show higher plans only
            const higherPlans = membershipPlans.filter((plan, index) => index > currentPlanIndex);

            if (higherPlans.length > 0) {
                upgradeSection.classList.remove('hidden');
                higherPlans.forEach(plan => {
                    const currentFee = membershipPlans.find(p => p.id === profile.membershipId)?.fee || 0;
                    const upgradeCost = plan.fee - currentFee;
                    const btn = document.createElement('button');
                    btn.className = 'upgrade-btn';
                    btn.textContent = `Upgrade to ${plan.name} (Pay ₦${upgradeCost.toLocaleString()} difference)`;
                    btn.addEventListener('click', () => {
                        if (confirm(`Upgrade to ${plan.name} for ₦${upgradeCost.toLocaleString()}?`)) {
                            payWithPaystack(profile.fullName, profile.email, profile.phone, plan, true, profile);
                        }
                    });
                    upgradeOptions.appendChild(btn);
                });
            } else {
                upgradeSection.classList.add('hidden');
            }
        }

        // ============ LOGOUT / CLEAR PROFILE ============
        logoutBtn.addEventListener('click', function() {
            if (confirm('Are you sure you want to clear your profile? This cannot be undone.')) {
                localStorage.removeItem('userProfile');
                profileSection.classList.add('hidden');
                registrationSection.classList.remove('hidden');
                registrationForm.reset();
                selectedPlan = null;
                upgradeSection.classList.add('hidden');
                document.querySelectorAll('.membership-option').forEach(el => el.classList.remove('selected'));
                renderMembershipOptions();
            }
        });

        // Start the app
        init();
    </script>
</body>
</html>
