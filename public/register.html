<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – ZBYTE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #050510; color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: rgba(15,15,35,0.9); border: 1px solid rgba(124,58,237,0.3); border-radius: 20px; padding: 32px 24px; width: 100%; max-width: 420px; }
    .logo { font-size: 1.6rem; font-weight: 800; text-align: center; background: linear-gradient(135deg,#7c3aed,#3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
    input, select { width: 100%; background: rgba(30,30,60,0.6); border: 1px solid rgba(124,58,237,0.3); border-radius: 10px; padding: 14px; color: white; margin-bottom: 12px; font-size: 1rem; }
    .plans { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .plan { background: rgba(30,30,60,0.6); border: 2px solid rgba(124,58,237,0.2); border-radius: 12px; padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .plan.selected { border-color: #7c3aed; background: rgba(124,58,237,0.15); }
    .plan-name { font-weight: 600; }
    .plan-price { color: #a78bfa; font-weight: 700; }
    button { width: 100%; background: linear-gradient(135deg,#7c3aed,#4f46e5); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 8px; }
    .terms { display: flex; align-items: flex-start; gap: 10px; margin: 12px 0 16px; font-size: 0.8rem; color: #94a3b8; }
    .terms input { width: auto; margin: 0; }
    .terms a { color: #a78bfa; text-decoration: none; }
    .login-link { text-align: center; margin-top: 16px; font-size: 0.85rem; color: #94a3b8; }
    .login-link a { color: #a78bfa; text-decoration: none; }
    .error { color: #f87171; font-size: 0.85rem; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ZBYTE</div>
    <div class="subtitle">Create your account</div>

    <form id="registerForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="tel" id="phone" placeholder="Phone Number" />
      <input type="password" id="password" placeholder="Password" required />
      <input type="text" id="referral" placeholder="Referral Code (optional)" />

      <div class="plans">
        <div class="plan" data-plan="silver" data-price="15000" onclick="selectPlan(this)">
          <div>
            <div class="plan-name">Silver Membership</div>
            <div style="font-size:0.75rem; color:#94a3b8;">Basic features</div>
          </div>
          <div class="plan-price">₦15,000</div>
        </div>
        <div class="plan" data-plan="gold" data-price="30000" onclick="selectPlan(this)">
          <div>
            <div class="plan-name">Gold Membership</div>
            <div style="font-size:0.75rem; color:#94a3b8;">Full access</div>
          </div>
          <div class="plan-price">₦30,000</div>
        </div>
        <div class="plan selected" data-plan="premium" data-price="5000" onclick="selectPlan(this)">
          <div>
            <div class="plan-name">Premium Membership</div>
            <div style="font-size:0.75rem; color:#94a3b8;">Best value</div>
          </div>
          <div class="plan-price">₦5,000</div>
        </div>
      </div>
      <input type="hidden" id="selectedPlan" value="premium" />
      <input type="hidden" id="selectedPrice" value="5000" />

      <div class="terms">
        <input type="checkbox" id="agree" required />
        <label for="agree">
          I agree to the <a href="/terms.html" target="_blank">Terms of Service</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>
        </label>
      </div>

      <button type="submit">Register & Pay</button>
      <div id="error" class="error"></div>
    </form>

    <div class="login-link">
      Already have an account? <a href="/login.html">Login</a>
    </div>
  </div>

  <script>
    function selectPlan(el) {
      document.querySelectorAll('.plan').forEach(p => p.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('selectedPlan').value = el.dataset.plan;
      document.getElementById('selectedPrice').value = el.dataset.price;
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      const data = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value,
        referral: document.getElementById('referral').value.trim(),
        membership: document.getElementById('selectedPlan').value,
        amount: document.getElementById('selectedPrice').value
      };

      if (!data.name || !data.email || !data.password) {
        errorEl.textContent = 'Please fill all required fields';
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Registration failed');
        if (result.authorization_url) {
          window.location.href = result.authorization_url;
        } else {
          alert('Registration successful!');
          window.location.href = '/login.html';
        }
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
