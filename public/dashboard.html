<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – ZBYTE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #050510;
      color: #ffffff;
      min-height: 100vh;
      padding-bottom: 80px;
      background-image: radial-gradient(circle at 20% 10%, rgba(80, 40, 200, 0.12) 0%, transparent 40%);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(10, 10, 25, 0.9);
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .profile { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .container { max-width: 480px; margin: 0 auto; padding: 16px; }
    .welcome { margin-bottom: 20px; }
    .welcome h1 { font-size: 1.6rem; }
    .welcome p { color: #94a3b8; font-size: 0.9rem; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .stat-card {
      background: rgba(15, 15, 35, 0.8);
      border: 1px solid rgba(124, 58, 237, 0.25);
      border-radius: 16px;
      padding: 16px;
    }
    .stat-card .label { font-size: 0.75rem; color: #94a3b8; }
    .stat-card .value { font-size: 1.4rem; font-weight: 700; margin-top: 4px; }
    .card {
      background: rgba(15, 15, 35, 0.8);
      border: 1px solid rgba(124, 58, 237, 0.25);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .task { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .task:last-child { border-bottom: none; }
    button {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;
    }
    .logout { background: #ef4444; padding: 6px 12px; font-size: 0.8rem; }
    input, select {
      width: 100%; background: rgba(30,30,60,0.6); border: 1px solid rgba(124,58,237,0.3);
      border-radius: 10px; padding: 11px; color: white; margin-bottom: 10px;
    }
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,10,25,0.95); backdrop-filter: blur(10px);
      display: flex; justify-content: space-around; padding: 10px 0;
      border-top: 1px solid rgba(124,58,237,0.2);
    }
    .nav a { color: #94a3b8; text-decoration: none; font-size: 0.7rem; text-align: center; }
    .nav a.active { color: #a78bfa; }
    .section { display: none; }
    .section.active { display: block; }
    .referral-box { display: flex; gap: 8px; }
    .referral-box input { flex: 1; margin: 0; }
  </style>
</head>
<body>
  <header>
    <div class="logo">ZBYTE</div>
    <div class="profile">
      <div class="avatar" id="avatar">U</div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div id="home" class="section active">
      <div class="welcome">
        <h1>Hello, <span id="welcomeName">User</span></h1>
        <p>Welcome back! Here's what's happening with your account.</p>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="label">Task Wallet</div>
          <div class="value" id="taskWallet">₦0</div>
        </div>
        <div class="stat-card">
          <div class="label">Referral Wallet</div>
          <div class="value" id="referralWallet">₦0</div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:10px;">Your Referral Link</h3>
        <div class="referral-box">
          <input type="text" id="referralLink" readonly />
          <button onclick="copyReferral()">Copy</button>
        </div>
      </div>
    </div>

    <div id="tasks" class="section">
      <div class="card">
        <h3 style="margin-bottom:12px;">Available Tasks</h3>
        <div id="tasksList">Loading...</div>
      </div>
    </div>

    <div id="wallet" class="section">
      <div class="card">
        <h3 style="margin-bottom:12px;">Request Withdrawal</h3>
        <select id="walletType">
          <option value="task">Task Wallet</option>
          <option value="referral">Referral Wallet</option>
        </select>
        <input type="number" id="amount" placeholder="Amount" />
        <input type="text" id="bankName" placeholder="Bank Name" />
        <input type="text" id="accountNumber" placeholder="Account Number" />
        <input type="text" id="accountName" placeholder="Account Name" />
        <button onclick="requestWithdrawal()">Request Withdrawal</button>
        <div id="withdrawError" style="color:#f87171; margin-top:10px;"></div>
      </div>
    </div>

    <div id="profile" class="section">
      <div class="card">
        <h3 style="margin-bottom:12px;">Profile</h3>
        <p><strong>Name:</strong> <span id="profileName">-</span></p>
        <p style="margin-top:8px;"><strong>Email:</strong> <span id="profileEmail">-</span></p>
        <p style="margin-top:8px;"><strong>Membership:</strong> <span id="profileTier">-</span></p>
        <p style="margin-top:8px;"><strong>Referral Code:</strong> <span id="profileRef">-</span></p>
      </div>
    </div>
  </div>

  <nav class="nav">
    <a href="#" onclick="showSection('home')" class="active" id="nav-home"><div>🏠</div>Home</a>
    <a href="#" onclick="showSection('tasks')" id="nav-tasks"><div>📋</div>Tasks</a>
    <a href="#" onclick="showSection('wallet')" id="nav-wallet"><div>💰</div>Wallet</a>
    <a href="#" onclick="showSection('profile')" id="nav-profile"><div>👤</div>Profile</a>
  </nav>

  <script>
    const token = localStorage.getItem('zbyte_token') || localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    function showSection(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
      document.getElementById(section).classList.add('active');
      document.getElementById('nav-' + section).classList.add('active');
    }

    function copyReferral() {
      const input = document.getElementById('referralLink');
      input.select();
      document.execCommand('copy');
      alert('Copied!');
    }

    async function loadUser() {
      try {
        const res = await fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + token } });
        const user = await res.json();
        if (!res.ok) throw new Error();
        const name = user.name || 'User';
        document.getElementById('welcomeName').textContent = name.split(' ')[0];
        document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
        document.getElementById('taskWallet').textContent = '₦' + (user.taskWallet || 0).toLocaleString();
        document.getElementById('referralWallet').textContent = '₦' + (user.referralWallet || 0).toLocaleString();
        document.getElementById('profileName').textContent = name;
        document.getElementById('profileEmail').textContent = user.email || '-';
        document.getElementById('profileTier').textContent = (user.tier || 'premium').toUpperCase();
        document.getElementById('profileRef').textContent = user.referralCode || '-';
        document.getElementById('referralLink').value = 'https://zbyte.com/register.html?ref=' + (user.referralCode || '');
      } catch (e) {
        localStorage.clear();
        window.location.href = '/login.html';
      }
    }

    async function loadTasks() {
      try {
        const res = await fetch('/api/tasks', { headers: { 'Authorization': 'Bearer ' + token } });
        const tasks = await res.json();
        const container = document.getElementById('tasksList');
        if (!tasks.length) {
          container.innerHTML = '<p>No tasks available.</p>';
          return;
        }
        container.innerHTML = tasks.map(task => `
          <div class="task">
            <div>
              <strong>${task.title}</strong><br>
              <small style="color:#94a3b8;">${task.description}</small><br>
              <span style="color:#4ade80;">₦${task.reward}</span>
            </div>
            <button onclick="completeTask('${task.id}')">Start</button>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('tasksList').innerHTML = '<p>Could not load tasks.</p>';
      }
    }

    async function completeTask(taskId) {
      try {
        const res = await fetch('/api/tasks/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ taskId })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        alert('Task completed! ₦' + data.reward + ' added.');
        loadUser();
        loadTasks();
      } catch (err) {
        alert(err.message);
      }
    }

    async function requestWithdrawal() {
      const errorEl = document.getElementById('withdrawError');
      errorEl.textContent = '';
      const data = {
        walletType: document.getElementById('walletType').value,
        amount: document.getElementById('amount').value,
        bankName: document.getElementById('bankName').value,
        accountNumber: document.getElementById('accountNumber').value,
        accountName: document.getElementById('accountName').value
      };
      if (!data.amount || !data.bankName || !data.accountNumber || !data.accountName) {
        errorEl.textContent = 'Please fill all fields';
        return;
      }
      try {
        const res = await fetch('/api/withdraw', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (!res.ok) throw new Erroii(kkr(result.error);
        alert('Withdrawal request submitted!');
        document.getElementById('amount').value = '';
        document.getElementById('bankName').value = '';
        document.getElementById('accountNumber').value = '';
        document.getElementById('accountName').value = '';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    loadUser();
    loadTasks();
  </script>
</body>
</html>
