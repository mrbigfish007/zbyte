<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – ZBYTE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #050510;
      color: #ffffff;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; background: rgba(10,10,25,0.9);
      border-bottom: 1px solid rgba(124,58,237,0.2);
    }
    .logo { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg,#7c3aed,#3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#4f46e5); display:flex; align-items:center; justify-content:center; font-weight:700; }
    .container { max-width:480px; margin:0 auto; padding:16px; }
    .welcome h1 { font-size:1.7rem; margin-bottom:4px; }
    .welcome p { color:#94a3b8; font-size:0.9rem; margin-bottom:16px; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
    .stat-card { background:rgba(15,15,35,0.8); border:1px solid rgba(124,58,237,0.25); border-radius:14px; padding:14px; }
    .stat-card .label { font-size:0.75rem; color:#94a3b8; }
    .stat-card .value { font-size:1.3rem; font-weight:700; margin-top:4px; }
    .card { background:rgba(15,15,35,0.8); border:1px solid rgba(124,58,237,0.25); border-radius:16px; padding:16px; margin-bottom:16px; }
    .logout { background:#ef4444; padding:6px 12px; font-size:0.8rem; border:none; color:white; border-radius:8px; }
    .nav { position:fixed; bottom:0; left:0; right:0; background:rgba(10,10,25,0.95); display:flex; justify-content:space-around; padding:10px 0; border-top:1px solid rgba(124,58,237,0.2); }
    .nav a { color:#94a3b8; text-decoration:none; font-size:0.7rem; text-align:center; }
  </style>
</head>
<body>
  <header>
    <div class="logo">ZBYTE</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="avatar" id="avatar">U</div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="welcome">
      <h1>Hello, <span id="welcomeName">User</span></h1>
      <p>Welcome back to ZBYTE.</p>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Task Wallet</div>
        <div class="value" id="taskWallet">₦0</div>
      </div>
      <div class="stat-card">
        <div class="label">Referral Wallet</div>
        <div class="value" id="referralWallet">₦0</div>
      </div>
    </div>

    <div class="card">
      <h3>Referral Code</h3>
      <p id="refCode" style="margin-top:8px; font-size:1.1rem;">-</p>
    </div>
  </div>

  <nav class="nav">
    <a href="/dashboard.html"><div>🏠</div>Home</a>
    <a href="/dashboard.html"><div>📋</div>Tasks</a>
    <a href="/dashboard.html"><div>💰</div>Wallet</a>
    <a href="/profile.html"><div>👤</div>Profile</a>
  </nav>

  <script>
    const token = localStorage.getItem('zbyte_token') || localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    async function loadUser() {
      try {
        const res = await fetch('/api/user/me', { 
          headers: { 'Authorization': 'Bearer ' + token } 
        });
        const user = await res.json();
        if (!res.ok) throw new Error();
        
        const name = user.name || 'User';
        document.getElementById('welcomeName').textContent = name.split(' ')[0];
        document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
        document.getElementById('taskWallet').textContent = '₦' + (user.taskWallet || 0).toLocaleString();
        document.getElementById('referralWallet').textContent = '₦' + (user.referralWallet || 0).toLocaleString();
        document.getElementById('refCode').textContent = user.referralCode || '-';
      } catch (e) {
        document.getElementById('welcomeName').textContent = 'User';
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    loadUser();
  </script>
</body>
</html>
