<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Zbyte</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); color: #f8fafc; min-height: 100vh; }
    header { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .logo { font-weight: 800; font-size: 1.6rem; color: #22c55e; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; border: 1px solid rgba(255,255,255,0.1); }
    .card.full { grid-column: 1 / -1; }
    h2 { margin-bottom: 12px; font-size: 1.1rem; color: #e2e8f0; }
    .balance { font-size: 2.2rem; font-weight: 800; color: #22c55e; }
    .small { font-size: 0.85rem; color: #94a3b8; margin-top: 6px; }
    .task { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .task:last-child { border-bottom: none; }
    button { background: #22c55e; color: #0f172a; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    button:hover { background: #16a34a; }
    input, select { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; color: white; margin-bottom: 12px; }
    .logout { background: #ef4444; color: white; }
    @media (max-width: 700px) {
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Zbyte</div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span id="userName">User</span>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Task Wallet</h2>
      <div class="balance" id="taskWallet">₦0</div>
      <div class="small">Minimum withdrawal: ₦50,000</div>
    </div>

    <div class="card">
      <h2>Referral Wallet</h2>
      <div class="balance" id="referralWallet">₦0</div>
      <div class="small">Minimum withdrawal: ₦10,000</div>
    </div>

    <div class="card full">
      <h2>Request Withdrawal</h2>
      <select id="walletType">
        <option value="task">Task Wallet</option>
        <option value="referral">Referral Wallet</option>
      </select>
      <input type="number" id="amount" placeholder="Amount" />
      <input type="text" id="bankName" placeholder="Bank Name" />
      <input type="text" id="accountNumber" placeholder="Account Number" />
      <input type="text" id="accountName" placeholder="Account Name" />
      <button onclick="requestWithdrawal()">Request Withdrawal</button>
      <div id="withdrawError" style="color:#f87171; margin-top:12px;"></div>
    </div>

    <div class="card full">
      <h2>Your Tasks <span style="float:right; color:#22c55e;">₦500 each</span></h2>
      <div id="tasksList">Loading tasks...</div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('zbyte_token') || localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    async function loadUser() {
      try {
        const res = await fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + token } });
        const user = await res.json();
        if (!res.ok) throw new Error();
        document.getElementById('userName').textContent = user.name || 'User';
        document.getElementById('taskWallet').textContent = '₦' + (user.taskWallet || 0).toLocaleString();
        document.getElementById('referralWallet').textContent = '₦' + (user.referralWallet || 0).toLocaleString();
      } catch (e) {
        localStorage.clear();
        window.location.href = '/login.html';
      }
    }

    async function loadTasks() {
      try {
        const res = await fetch('/api/tasks', { headers: { 'Authorization': 'Bearer ' + token } });
        const tasks = await res.json();
        const container = document.getElementById('tasksList');
        if (!tasks.length) {
          container.innerHTML = '<p>No tasks available right now.</p>';
          return;
        }
        container.innerHTML = tasks.map(task => `
          <div class="task">
            <div>
              <strong>${task.title}</strong><br>
              <small style="color:#94a3b8;">${task.description}</small><br>
              <span style="color:#22c55e; font-weight:700;">₦${task.reward}</span>
            </div>
            <button onclick="completeTask('${task.id}')">Start</button>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('tasksList').innerHTML = '<p>Could not load tasks.</p>';
      }
    }

    async function completeTask(taskId) {
      try {
        const res = await fetch('/api/tasks/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ taskId })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        alert('Task completed! ₦' + data.reward + ' added.');
        loadUser();
        loadTasks();
      } catch (err) {
        alert(err.message);
      }
    }

    async function requestWithdrawal() {
      const errorEl = document.getElementById('withdrawError');
      errorEl.textContent = '';
      const data = {
        walletType: document.getElementById('walletType').value,
        amount: document.getElementById('amount').value,
        bankName: document.getElementById('bankName').value,
        accountNumber: document.getElementById('accountNumber').value,
        accountName: document.getElementById('accountName').value
      };
      if (!data.amount || !data.bankName || !data.accountNumber || !data.accountName) {
        errorEl.textContent = 'Please fill all fields';
        return;
      }
      try {
        const res = await fetch('/api/withdraw', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error);
        alert('Withdrawal request submitted!');
        document.getElementById('amount').value = '';
        document.getElementById('bankName').value = '';
        document.getElementById('accountNumber').value = '';
        document.getElementById('accountName').value = '';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    loadUser();
    loadTasks();
  </script>
</body>
        </html>
