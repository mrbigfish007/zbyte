<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – ZBYTE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #050510; color: #ffffff; min-height: 100vh; padding-bottom: 90px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
    .logo { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg,#7c3aed,#3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .container { max-width: 480px; margin: 0 auto; padding: 10px 16px; }
    .profile-header { text-align: center; margin-bottom: 24px; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg,#7c3aed,#4f46e5); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; margin: 0 auto 12px; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-size: 1.3rem; font-weight: 700; }
    .email { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }
    .card { background: rgba(15,15,35,0.85); border: 1px solid rgba(124,58,237,0.25); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.08); cursor: pointer; }
    .menu-item:last-child { border-bottom: none; }
    .menu-item span { display: flex; align-items: center; gap: 10px; }
    input, textarea { width: 100%; background: rgba(30,30,60,0.6); border: 1px solid rgba(124,58,237,0.3); border-radius: 10px; padding: 12px; color: white; margin-bottom: 10px; }
    textarea { min-height: 80px; resize: vertical; }
    button { background: linear-gradient(135deg,#7c3aed,#4f46e5); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; }
    button.secondary { background: #334155; margin-top: 8px; }
    .logout { background: #ef4444; padding: 6px 12px; font-size: 0.8rem; width: auto; }
    .nav { position: fixed; bottom: 16px; left: 16px; right: 16px; background: rgba(20,20,40,0.95); border: 1px solid rgba(124,58,237,0.2); border-radius: 20px; display: flex; justify-content: space-around; padding: 8px; }
    .nav a { color: #94a3b8; text-decoration: none; font-size: 0.65rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px; border-radius: 14px; }
    .nav a.active { background: linear-gradient(135deg,#7c3aed,#4f46e5); color: white; }
    .nav-icon { font-size: 1.2rem; }
    .section { display: none; }
    .section.active { display: block; }
    .notification-item { background: rgba(30,30,60,0.5); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .notification-item .date { font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <div class="logo">ZBYTE</div>
    <button class="logout" onclick="logout()">Logout</button>
  </header>

  <div class="container">
    <div class="profile-header">
      <div class="avatar" id="avatar">U</div>
      <div class="name" id="userName">User</div>
      <div class="email" id="userEmail">email@example.com</div>
    </div>

    <div class="card">
      <div class="menu-item" onclick="showSection('editProfile')">
        <span>✏️ Edit Profile</span>
        <span>›</span>
      </div>
      <div class="menu-item" onclick="showSection('notifications')">
        <span>🔔 Notifications</span>
        <span>›</span>
      </div>
      <div class="menu-item" onclick="contactUs()">
        <span>💬 Contact Us</span>
        <span>›</span>
      </div>
      <div class="menu-item" onclick="showSection('security')">
        <span>🔒 Security</span>
        <span>›</span>
      </div>
    </div>

    <div id="editProfile" class="section">
      <div class="card">
        <h3 style="margin-bottom: 12px;">Edit Profile</h3>
        <input type="text" id="editName" placeholder="Name" />
        <input type="text" id="editPhone" placeholder="Phone" />
        <textarea id="editBio" placeholder="Bio"></textarea>
        <button onclick="saveProfile()">Save Changes</button>
        <button class="secondary" onclick="showSection('main')">Back</button>
        <div id="profileMsg" style="margin-top: 10px; color: #4ade80;"></div>
      </div>
    </div>

    <div id="notifications" class="section">
      <div class="card">
        <h3 style="margin-bottom: 12px;">Notifications</h3>
        <div id="notificationsList">
          <div class="notification-item">
            <div>Welcome to ZBYTE! Complete tasks and earn rewards.</div>
            <div class="date">Today</div>
          </div>
          <div class="notification-item">
            <div>Your membership is active. Start earning now!</div>
            <div class="date">Today</div>
          </div>
        </div>
        <button class="secondary" onclick="showSection('main')">Back</button>
      </div>
    </div>

    <div id="security" class="section">
      <div class="card">
        <h3 style="margin-bottom: 12px;">Change Password</h3>
        <input type="password" id="currentPassword" placeholder="Current Password" />
        <input type="password" id="newPassword" placeholder="New Password" />
        <button onclick="changePassword()">Update Password</button>
        <button class="secondary" onclick="showSection('main')">Back</button>
        <div id="securityMsg" style="margin-top: 10px; color: #4ade80;"></div>
      </div>
    </div>
  </div>

  <nav class="nav">
    <a href="/dashboard.html"><div class="nav-icon">🏠</div>Home</a>
    <a href="/dashboard.html"><div class="nav-icon">📋</div>Tasks</a>
    <a href="/dashboard.html"><div class="nav-icon">💰</div>Wallet</a>
    <a href="/profile.html" class="active"><div class="nav-icon">👤</div>Profile</a>
  </nav>

  <script>
    const token = localStorage.getItem('zbyte_token') || localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    function showSection(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      if (section !== 'main') {
        document.getElementById(section).classList.add('active');
      }
    }

    function contactUs() {
      window.open('https://wa.me/2349010289211', '_blank');
    }

    async function loadUser() {
      try {
        const res = await fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + token } });
        const user = await res.json();
        document.getElementById('userName').textContent = user.name || 'User';
        document.getElementById('userEmail').textContent = user.email || '';
        document.getElementById('editName').value = user.name || '';
        document.getElementById('editPhone').value = user.phone || '';
        document.getElementById('editBio').value = user.bio || '';
        const avatar = document.getElementById('avatar');
        if (user.profilePicture) {
          avatar.innerHTML = `<img src="${user.profilePicture}" alt="Profile" />`;
        } else {
          avatar.textContent = (user.name || 'U').charAt(0).toUpperCase();
        }
      } catch (e) {}
    }

    async function saveProfile() {
      const msg = document.getElementById('profileMsg');
      msg.textContent = '';
      try {
        const res = await fetch('/api/user/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            name: document.getElementById('editName').value,
            phone: document.getElementById('editPhone').value,
            bio: document.getElementById('editBio').value
          })
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Failed');
        msg.textContent = 'Profile updated!';
        loadUser();
      } catch (e) {
        msg.textContent = e.message;
        msg.style.color = '#f87171';
      }
    }

    async function changePassword() {
      const msg = document.getElementById('securityMsg');
      msg.textContent = '';
      try {
        const res = await fetch('/api/user/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            currentPassword: document.getElementById('currentPassword').value,
            password: document.getElementById('newPassword').value
          })
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Failed');
        msg.textContent = 'Password updated!';
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
      } catch (e) {
        msg.textContent = e.message;
        msg.style.color = '#f87171';
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    loadUser();
  </script>
</body>
</html>
