<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – ZBYTE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #050510;
      color: #ffffff;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, rgba(80, 40, 200, 0.18) 0%, transparent 50%);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(10, 10, 25, 0.9);
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .back { color: #a78bfa; text-decoration: none; font-size: 0.9rem; }
    .container { max-width: 440px; margin: 24px auto; padding: 0 16px; }
    .user-card {
      background: rgba(15, 15, 35, 0.85);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      margin: 0 auto 12px;
    }
    .user-card h2 { font-size: 1.3rem; margin-bottom: 4px; }
    .user-card p { color: #a78bfa; font-size: 0.85rem; }
    .menu-item {
      background: rgba(15, 15, 35, 0.85);
      border: 1px solid rgba(124, 58, 237, 0.25);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    .menu-item:hover { border-color: #7c3aed; transform: translateY(-1px); }
    .menu-left { display: flex; align-items: center; gap: 14px; }
    .icon {
      width: 40px;
      height: 40px;
      background: rgba(124, 58, 237, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .logout { border-color: rgba(239, 68, 68, 0.4); }
    .logout .icon { background: rgba(239, 68, 68, 0.2); }
    .arrow { color: #64748b; font-size: 1.2rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">ZBYTE</div>
    <a href="/dashboard.html" class="back">← Back</a>
  </header>

  <div class="container">
    <div class="user-card">
      <div class="avatar" id="avatar">U</div>
      <h2 id="userName">User</h2>
      <p>ZBYTE Member</p>
    </div>

    <div class="menu-item" onclick="alert('Change Name feature coming soon')">
      <div class="menu-left">
        <div class="icon">✏️</div>
        <div>
          <div>Change Name</div>
          <div style="font-size:0.75rem; color:#94a3b8;">Update your display name</div>
        </div>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="menu-item" onclick="alert('Change Password feature coming soon')">
      <div class="menu-left">
        <div class="icon">🔒</div>
        <div>
          <div>Change Password</div>
          <div style="font-size:0.75rem; color:#94a3b8;">Update your password</div>
        </div>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="menu-item" onclick="alert('Notifications coming soon')">
      <div class="menu-left">
        <div class="icon">🔔</div>
        <div>
          <div>Notifications</div>
          <div style="font-size:0.75rem; color:#94a3b8;">Manage alerts</div>
        </div>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="menu-item logout" onclick="logout()">
      <div class="menu-left">
        <div class="icon">🚪</div>
        <div>
          <div style="color:#f87171;">Logout</div>
          <div style="font-size:0.75rem; color:#94a3b8;">Sign out of your account</div>
        </div>
      </div>
      <span class="arrow">›</span>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('zbyte_token') || localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    async function loadUser() {
      try {
        const res = await fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + token } });
        const user = await res.json();
        if (!res.ok) throw new Error();
        const name = user.name || 'User';
        document.getElementById('userName').textContent = name;
        document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
      } catch (e) {
        // fallback
        document.getElementById('userName').textContent = 'MR BIG FSH';
        document.getElementById('avatar').textContent = 'M';
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    loadUser();
  </script>
</body>
</html>
