<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Zbyte | MR BIG FSH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gray-100">
  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
    <div>
      <div class="text-xl font-bold">Zbyte Admin</div>
      <div class="text-xs text-slate-400">Founder & CEO: MR BIG FSH (Orakwe Chinecherem Michael)</div>
    </div>
    <div class="flex gap-4 text-sm">
      <a href="/" class="hover:underline">View site</a>
      <a href="/about.html" class="hover:underline">About</a>
      <button onclick="logout()" class="text-red-400 hover:underline">Logout</button>
    </div>
  </header>

  <!-- Login Gate -->
  <div id="loginGate" class="max-w-md mx-auto mt-16 bg-white rounded-2xl p-8 shadow">
    <h1 class="text-2xl font-bold mb-2">Admin Login</h1>
    <p class="text-sm text-gray-600 mb-6">Only the Founder/Admin account can access this panel.</p>
    <input id="adminEmail" type="email" placeholder="Email" class="w-full border rounded-lg px-4 py-3 mb-3" value="admin@zbyte.com.ng" />
    <input id="adminPass" type="password" placeholder="Password" class="w-full border rounded-lg px-4 py-3 mb-4" />
    <button onclick="adminLogin()" class="w-full bg-slate-900 text-white py-3 rounded-lg font-semibold">Login as Admin</button>
    <div id="adminErr" class="text-red-600 text-sm mt-3 hidden"></div>
  </div>

  <!-- Admin Content -->
  <div id="adminContent" class="hidden max-w-6xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-2">Dashboard</h1>
    <p class="text-gray-600 mb-6">All members and activity</p>

    <div class="flex gap-3 mb-6">
      <button onclick="runMonthlyFees()" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-medium">Run Monthly Fees</button>
      <button onclick="loadAll()" class="bg-white border px-4 py-2 rounded-lg">Refresh</button>
    </div>

    <div id="stats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>

    <div class="bg-white rounded-xl border mb-6">
      <div class="p-4 border-b flex flex-col sm:flex-row gap-3">
        <input id="search" oninput="filterUsers()" placeholder="Search name, email, phone or referral code..." class="flex-1 border rounded-lg px-4 py-2" />
        <select id="tierFilter" onchange="filterUsers()" class="border rounded-lg px-3 py-2">
          <option value="">All tiers</option>
          <option value="premium">Premium</option>
          <option value="silver">Silver</option>
          <option value="gold">Gold</option>
        </select>
        <select id="statusFilter" onchange="filterUsers()" class="border rounded-lg px-3 py-2">
          <option value="">All status</option>
          <option value="active">Activated</option>
          <option value="inactive">Not activated</option>
        </select>
      </div>
      <div id="usersTable" class="overflow-x-auto"></div>
    </div>

    <div class="bg-white rounded-xl border">
      <div class="p-4 border-b font-semibold">Pending Withdrawals</div>
      <div id="withdrawalsList"></div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('zbyte_token');
    let allUsers = [];

    function headers() {
      return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
    }

    function naira(n) {
      return '₦' + Number(n || 0).toLocaleString('en-NG');
    }

    async function adminLogin() {
      const identifier = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPass').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier, password })
      });
      const data = await res.json();
      if (!res.ok) {
        showErr(data.error || 'Login failed');
        return;
      }
      if (!data.user.isAdmin) {
        showErr('This account is not an admin.');
        return;
      }
      token = data.token;
      localStorage.setItem('zbyte_token', token);
      showAdmin();
    }

    function showErr(msg) {
      const el = document.getElementById('adminErr');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function showAdmin() {
      document.getElementById('loginGate').classList.add('hidden');
      document.getElementById('adminContent').classList.remove('hidden');
      loadAll();
    }

    async function loadAll() {
      try {
        const [statsRes, usersRes] = await Promise.all([
          fetch('/api/admin/stats', { headers: headers() }),
          fetch('/api/admin/users', { headers: headers() })
        ]);

        if (statsRes.status === 401 || statsRes.status === 403) {
          document.getElementById('loginGate').classList.remove('hidden');
          document.getElementById('adminContent').classList.add('hidden');
          return;
        }

        const stats = await statsRes.json();
        allUsers = await usersRes.json() || [];

        document.getElementById('stats').innerHTML = `
          <div class="bg-white rounded-xl border p-5">
            <div class="text-xs text-gray-500 uppercase">Total Members</div>
            <div class="text-2xl font-bold mt-1">${stats.totalMembers || 0}</div>
          </div>
          <div class="bg-white rounded-xl border p-5">
            <div class="text-xs text-gray-500 uppercase">Activated Memberships</div>
            <div class="text-2xl font-bold mt-1 text-green-600">${stats.activatedMemberships || 0}</div>
          </div>
          <div class="bg-white rounded-xl border p-5">
            <div class="text-xs text-gray-500 uppercase">Pending Withdrawals</div>
            <div class="text-2xl font-bold mt-1">0</div>
          </div>
          <div class="bg-white rounded-xl border p-5">
            <div class="text-xs text-gray-500 uppercase">Task Rewards Paid</div>
            <div class="text-2xl font-bold mt-1">${naira(stats.taskRewardsPaid)}</div>
          </div>
        `;

        filterUsers();
        document.getElementById('withdrawalsList').innerHTML = '<div class="p-5 text-gray-500">No pending withdrawals</div>';
      } catch (e) {
        console.error(e);
      }
    }

    function filterUsers() {
      const q = (document.getElementById('search').value || '').toLowerCase();
      const tier = document.getElementById('tierFilter').value;
      const status = document.getElementById('statusFilter').value;

      let filtered = allUsers.filter(u => {
        const matchQ = !q || (u.name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q) || (u.phone || '').includes(q) || (u.referralCode || '').toLowerCase().includes(q);
        const matchTier = !tier || u.tier === tier;
        const matchStatus = !status || (status === 'active' ? u.membershipActive : !u.membershipActive);
        return matchQ && matchTier && matchStatus;
      });

      const rows = filtered.map(u => `
        <tr class="border-t">
          <td class="px-4 py-3">${u.name || '-'}</td>
          <td class="px-4 py-3">${u.email}</td>
          <td class="px-4 py-3">${u.phone || '-'}</td>
          <td class="px-4 py-3 capitalize">${u.tier}</td>
          <td class="px-4 py-3">${u.membershipActive ? '<span class="text-green-600">Active</span>' : '<span class="text-gray-500">Pending</span>'}</td>
          <td class="px-4 py-3">${naira(u.taskWallet)}</td>
          <td class="px-4 py-3">${naira(u.referralWallet)}</td>
          <td class="px-4 py-3">${u.tasksCompleted || 0}</td>
          <td class="px-4 py-3">${u.referralCode || '-'}</td>
        </tr>
      `).join('');

      document.getElementById('usersTable').innerHTML = `
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-left">
            <tr>
              <th class="px-4 py-3">Name</th>
              <th class="px-4 py-3">Email</th>
              <th class="px-4 py-3">Phone</th>
              <th class="px-4 py-3">Tier</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">Task Wallet</th>
              <th class="px-4 py-3">Referral Wallet</th>
              <th class="px-4 py-3">Tasks</th>
              <th class="px-4 py-3">Referral Code</th>
            </tr>
          </thead>
          <tbody>${rows || '<tr><td colspan="9" class="p-5 text-center text-gray-500">No members found</td></tr>'}</tbody>
        </table>
      `;
    }

    function logout() {
      localStorage.removeItem('zbyte_token');
      location.reload();
    }

    async function runMonthlyFees() {
      alert('Monthly fee feature will be added later.');
    }

    if (token) {
      showAdmin();
    }
  </script>
</body>
</html>
