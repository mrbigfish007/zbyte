<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Zbyte | MR BIG FSH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: system-ui, -apple-system, sans-serif; }</style>
</head>
<body class="bg-gray-100">
  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
    <div>
      <div class="text-xl font-bold">Zbyte Admin</div>
      <div class="text-xs text-slate-400">Founder & CEO: MR BIG FSH (Orakwe Chinecherem Michael)</div>
    </div>
    <div class="flex gap-4 text-sm">
      <a href="/" class="hover:underline">View site</a>
      <button onclick="logout()" class="text-red-400 hover:underline">Logout</button>
    </div>
  </header>

  <div id="loginGate" class="max-w-md mx-auto mt-16 bg-white rounded-2xl p-8 shadow">
    <h1 class="text-2xl font-bold mb-2">Admin Login</h1>
    <p class="text-sm text-gray-600 mb-6">Only the Founder/Admin account can access this panel.</p>
    <input id="adminEmail" type="email" placeholder="Email" class="w-full border rounded-lg px-4 py-3 mb-3" value="admin@zbyte.com.ng" />
    <input id="adminPass" type="password" placeholder="Password" class="w-full border rounded-lg px-4 py-3 mb-4" />
    <button onclick="adminLogin()" class="w-full bg-slate-900 text-white py-3 rounded-lg font-semibold">Login as Admin</button>
    <div id="adminErr" class="text-red-600 text-sm mt-3 hidden"></div>
  </div>

  <div id="adminContent" class="hidden max-w-6xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Admin Dashboard</h1>
    
    <div class="flex gap-3 mb-6">
      <button onclick="runMonthlyFees()" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-medium">Run Monthly Fees (₦5,000)</button>
      <button onclick="loadAll()" class="bg-white border px-4 py-2 rounded-lg">Refresh</button>
    </div>

    <div class="bg-white rounded-xl border mb-6">
      <div class="p-4 border-b font-semibold">Pending Withdrawals</div>
      <div id="withdrawalsList"></div>
    </div>

    <div class="bg-white rounded-xl border">
      <div class="p-4 border-b font-semibold">All Members</div>
      <div id="usersTable" class="overflow-x-auto"></div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('zbyte_token');
    let allUsers = [];

    function headers() {
      return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
    }

    function naira(n) {
      return '₦' + Number(n || 0).toLocaleString('en-NG');
    }

    async function adminLogin() {
      const identifier = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPass').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier, password })
      });
      const data = await res.json();
      if (!res.ok) return showErr(data.error || 'Login failed');
      if (!data.user.isAdmin) return showErr('This account is not an admin.');
      token = data.token;
      localStorage.setItem('zbyte_token', token);
      showAdmin();
    }

    function showErr(msg) {
      const el = document.getElementById('adminErr');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function showAdmin() {
      document.getElementById('loginGate').classList.add('hidden');
      document.getElementById('adminContent').classList.remove('hidden');
      loadAll();
    }

    async function loadAll() {
      try {
        const [usersRes, withdrawalsRes] = await Promise.all([
          fetch('/api/admin/users', { headers: headers() }),
          fetch('/api/admin/withdrawals', { headers: headers() })
        ]);

        if (usersRes.status === 401 || usersRes.status === 403) {
          document.getElementById('loginGate').classList.remove('hidden');
          document.getElementById('adminContent').classList.add('hidden');
          return;
        }

        allUsers = await usersRes.json() || [];
        const withdrawals = await withdrawalsRes.json() || [];

        const pending = withdrawals.filter(w => w.status === 'pending');
        document.getElementById('withdrawalsList').innerHTML = pending.length
          ? pending.map(w => {
              const user = allUsers.find(u => u.id === w.userId);
              return `
                <div class="px-5 py-4 border-b flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <div class="font-medium">\( {naira(w.amount)} <span class="text-xs text-gray-500">( \){w.walletType} wallet)</span></div>
                    <div class="text-xs text-gray-500 mt-0.5">
                      ${user ? user.name : 'Unknown'} • ${w.accountName} • ${w.bankName} • ${w.accountNumber}
                    </div>
                  </div>
                  <div class="flex gap-2">
                    <button onclick="updateWithdrawal('${w.id}', 'approved')" class="bg-green-600 text-white text-xs px-3 py-1 rounded">Approve</button>
                    <button onclick="updateWithdrawal('${w.id}', 'rejected')" class="bg-red-600 text-white text-xs px-3 py-1 rounded">Reject</button>
                  </div>
                </div>
              `;
            }).join('')
          : '<div class="p-5 text-gray-500">No pending withdrawals</div>';

        const rows = allUsers.map(u => `
          <tr class="border-t">
            <td class="px-4 py-3">${u.name || '-'}</td>
            <td class="px-4 py-3">${u.email}</td>
            <td class="px-4 py-3 capitalize">${u.tier || '-'}</td>
            <td class="px-4 py-3">${u.membershipActive ? '<span class="text-green-600">Active</span>' : '<span class="text-gray-500">Pending</span>'}</td>
            <td class="px-4 py-3">${naira(u.taskWallet)}</td>
            <td class="px-4 py-3">${u.feePending ? '<span class="text-orange-600">Yes</span>' : 'No'}</td>
          </tr>
        `).join('');

        document.getElementById('usersTable').innerHTML = `
          <table class="w-full text-sm">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-4 py-3 text-left">Name</th>
                <th class="px-4 py-3 text-left">Email</th>
                <th class="px-4 py-3 text-left">Tier</th>
                <th class="px-4 py-3 text-left">Status</th>
                <th class="px-4 py-3 text-left">Task Wallet</th>
                <th class="px-4 py-3 text-left">Fee Pending</th>
              </tr>
            </thead>
            <tbody>${rows || '<tr><td colspan="6" class="p-5 text-center text-gray-500">No members</td></tr>'}</tbody>
          </table>
        `;
      } catch (e) {
        console.error(e);
      }
    }

    async function updateWithdrawal(id, status) {
      if (!confirm(`Are you sure you want to ${status} this withdrawal?`)) return;
      const res = await fetch('/api/admin/withdrawals/update', {
        method: 'POST',
        headers: headers(),
        body: JSON.stringify({ id, status })
      });
      const data = await res.json();
      if (res.ok) {
        alert('Updated successfully');
        loadAll();
      } else {
        alert(data.error || 'Failed');
      }
    }

    async function runMonthlyFees() {
      if (!confirm('Deduct ₦5,000 monthly fee from all active members?')) return;
      const res = await fetch('/api/admin/run-monthly-fees', {
        method: 'POST',
        headers: headers()
      });
      const data = await res.json();
      if (res.ok) {
        alert(`Done! Processed: ${data.processed}, Pending: ${data.pending}`);
        loadAll();
      } else {
        alert(data.error || 'Failed');
      }
    }

    function logout() {
      localStorage.removeItem('zbyte_token');
      location.reload();
    }

    if (token) showAdmin();
  </script>
</body>
</html>
